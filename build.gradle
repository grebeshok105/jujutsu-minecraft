plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
		content {
			includeGroup('software.bernie.geckolib')
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jujutsumod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Ported Rich-Modern clickgui sources use lombok (main + client source sets).
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	clientCompileOnly 'org.projectlombok:lombok:1.18.36'
	clientAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}

