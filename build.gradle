// The verification programs are plain main() classes guarded by `assert`, so a task that forgets to
// enable assertions does not fail — it passes unconditionally, forever, in silence. This audit reads
// the real Gradle task model rather than the text of this file, so a task registered from anywhere is
// still covered.
tasks.register('verifyAssertionsEnabled') {
	group = 'verification'
	description = 'Fails if any verification JavaExec task would run with assertions disabled'
	doLast {
		// Realized into a plain list: DomainObjectCollection.findAll(Closure) is removed in Gradle 10.
		def programs = tasks.withType(JavaExec).matching { it.group == 'verification' }.toList()
		def offenders = programs.findAll { program -> !enablesAssertions(program) }
				.collect { it.name }
				.toSorted()
		if (!offenders.isEmpty()) {
			throw new GradleException(
					'These verification JavaExec tasks run with assertions disabled, so every assert inside them\n'
							+ 'is skipped and the task passes unconditionally:\n'
							+ offenders.collect { "  - ${it}" }.join('\n')
							+ "\nGive each one `jvmArgs '-ea'` or `enableAssertions = true`.")
		}
		logger.lifecycle("verifyAssertionsEnabled: ${programs.size()} verification JavaExec tasks all enable assertions")
	}
}

// True when this program will actually evaluate its `assert` statements, by either route the JVM offers.
static boolean enablesAssertions(JavaExec program) {
	if (program.enableAssertions) {
		return true
	}
	return program.jvmArgs.any { String arg ->
		arg == '-ea' || arg == '-enableassertions' || arg.startsWith('-ea:') || arg.startsWith('-enableassertions:')
	}
}

// The documentation audit used to exist only as a CI step, so a documentation break was discovered
// after a push rather than before a commit. It is part of the gate now.
tasks.register('auditDocumentation') {
	group = 'verification'
	description = 'Runs the repository documentation audit (tools/audit_docs.py)'
	def auditScript = layout.projectDirectory.file('tools/audit_docs.py').asFile
	def projectRoot = layout.projectDirectory.asFile
	doLast {
		String interpreter = resolvePythonInterpreter()
		if (interpreter == null) {
			throw new GradleException('Documentation audit could not run: neither python3 nor python is on PATH.')
		}
		Process audit = new ProcessBuilder(interpreter, auditScript.absolutePath)
				.directory(projectRoot)
				.redirectErrorStream(true)
				.start()
		String report = audit.inputStream.getText('UTF-8')
		int exitCode = audit.waitFor()
		report.readLines().each { logger.lifecycle(it) }
		if (exitCode != 0) {
			throw new GradleException("Documentation audit failed: ${interpreter} tools/audit_docs.py exited ${exitCode}. See the report above.")
		}
	}
}

// Windows ships `python`, CI ships `python3`, and the repository is worked on from both.
static String resolvePythonInterpreter() {
	for (String candidate : ['python3', 'python']) {
		try {
			Process probe = new ProcessBuilder(candidate, '--version').redirectErrorStream(true).start()
			probe.inputStream.getText('UTF-8')
			if (probe.waitFor() == 0) {
				return candidate
			}
		} catch (IOException ignored) {
			// Not on PATH under this name; try the next one.
		}
	}
	return null
}

// The gametest source set exists only to prove the server harness (issue #42 Stage A); none of its
// content may reach the release jar. This audit scans the remapped jar entry by entry, so it is a
// plain task: never JavaExec, and its name must not match the audit_docs.py test-task pattern, or
// the verification_programs metric would drift. Scope note: the scan walks the OUTER jar's entries
// only — if jar-in-jar bundling (loom `include` / nested META-INF/jars) is ever introduced, this
// audit must learn to open nested jars, or a bundled test mod would slip past every rule here.
tasks.register('auditReleaseJarIsolation') {
	group = 'verification'
	description = 'Fails when the release jar leaks test-mod or dev-only content'
	dependsOn tasks.named('remapJar')
	doLast {
		File jarFile = tasks.remapJar.archiveFile.get().asFile
		def offenders = []
		int entryCount = 0
		def rootDescriptorText = null

		new java.util.zip.ZipFile(jarFile).withCloseable { java.util.zip.ZipFile zip ->
			for (java.util.zip.ZipEntry entry : Collections.list(zip.entries())) {
				String name = entry.name
				entryCount++
				if (name.startsWith('jujutsu/mod/gametest/')) {
					offenders << "${name}  (gametest test-mod classes)"
				}
				if (name.startsWith('jujutsu/mod/bridge/') || name.startsWith('jujutsu/mod/mcp/')
						|| name.startsWith('jujutsu/mod/control/')) {
					offenders << "${name}  (dev-only surface jujutsu/mod/{bridge,mcp,control}/)"
				}
				if (name.startsWith('data/jujutsumod-gametest/') || name.contains('gametest/structure')) {
					offenders << "${name}  (gametest test-mod data or SNBT structure)"
				}
				if (name.startsWith('net/fabricmc/fabric/api/gametest/')) {
					offenders << "${name}  (test-only fabric gametest API)"
				}
				if (name.startsWith('net/fabricmc/fabric/api/client/gametest/')
						|| name.startsWith('net/fabricmc/fabric/impl/client/gametest/')) {
					offenders << "${name}  (test-only fabric client gametest API)"
				}
				if (name.startsWith('com/tngtech/archunit/')) {
					offenders << "${name}  (test-only ArchUnit classes)"
				}
				if (name.startsWith('com/chapmanjw/')) {
					offenders << "${name}  (upstream MCP server classes com/chapmanjw/)"
				}
				if (name.startsWith('io/modelcontextprotocol/')) {
					offenders << "${name}  (MCP protocol SDK io/modelcontextprotocol/)"
				}
				if (name.startsWith('jujutsu/mcpdev/')) {
					offenders << "${name}  (dev-only MCP companion classes jujutsu/mcpdev/)"
				}
				if (name == 'fabric.mod.json') {
					if (rootDescriptorText != null) {
						offenders << "${name}  (second fabric.mod.json descriptor beyond the root one)"
					} else {
						rootDescriptorText = zip.getInputStream(entry).getText('UTF-8')
					}
				}
			}

			if (rootDescriptorText != null) {
				def descriptor = new groovy.json.JsonSlurper().parseText(rootDescriptorText)
				if (descriptor.id == 'jujutsumod-gametest') {
					offenders << "fabric.mod.json  (root descriptor is the gametest test-mod id 'jujutsumod-gametest')"
				}
				if (descriptor.entrypoints instanceof Map
						&& (descriptor.entrypoints.containsKey('fabric-gametest')
								|| descriptor.entrypoints.containsKey('fabric-client-gametest'))) {
					offenders << "fabric.mod.json  (fabric-gametest / fabric-client-gametest entrypoints present)"
				}
				if (descriptor.entrypoints instanceof Map
						&& descriptor.entrypoints.containsKey('mcp-tools')) {
					offenders << "fabric.mod.json  (mcp-tools entrypoint present)"
				}
			}
		}

		if (!offenders.isEmpty()) {
			throw new GradleException(
					'Release jar leaks test-mod or dev-only content: ' + jarFile.absolutePath + '\n'
							+ offenders.collect { "  - ${it}" }.join('\n')
							+ '\nKeep the gametest source set, test-only libraries and the dev-only MCP companion out of the release jar.')
		}
		logger.lifecycle("auditReleaseJarIsolation: ${jarFile.name}: ${entryCount} entries scanned, no test-mod or dev-only content")
	}
}

// The one command. Nothing may be called verified without a green run of this task.
tasks.register('qualityGate') {
	group = 'verification'
	description = 'The merge gate: check, the documentation audit and the assertion-flag audit'
	// `check` already pulls compileJava and compileClientJava through the test classpath, so the
	// compiler barrier is inside the gate without naming it here.
	dependsOn tasks.named('check')
	dependsOn tasks.named('auditDocumentation')
	dependsOn tasks.named('verifyAssertionsEnabled')
}

// qualityGate-level, not check-level: `check` runs before remapJar has produced the release jar, and
// this audit inspects that jar. Same precedent as auditDocumentation — post-build audits live in the gate.
tasks.named('qualityGate') {
	dependsOn 'auditReleaseJarIsolation'
}

processResources {
	def version = project.version
	inputs.property "version", version
	exclude "source-assets/**"

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'vfx.main.classes', layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
	// The architecture rules read the two compiled outputs as separate class sets, so the client output
	// has to exist by the time they run. Without this the client rules would import an empty directory.
	dependsOn tasks.named('clientClasses')
	// A JUnit setup that discovers nothing is the same silent pass as a JavaExec task without -ea:
	// the task is green because it ran no assertions, not because the assertions held. Proven able to
	// fail — see the commit that introduced it.
	failOnNoDiscoveredTests = true
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
