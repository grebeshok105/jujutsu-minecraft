plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
		content {
			includeGroup('software.bernie.geckolib')
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jujutsumod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Stage A (issue #42): the server GameTest harness. fabricApi.configureTests creates the
// `gametest` source set (src/gametest) and the `gameTest` run config with the runGameTest task,
// which Loom attaches to `check`. Stage B adds the client lane: enableClientGameTests makes Loom
// create the `clientGameTest` run config and the `runClientGameTest` task (group `fabric`), which
// Loom deliberately does NOT attach to `check` — the client lane stays non-required by design
// (issue #42 Stage B), so the gate's composition is unchanged.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'jujutsumod-gametest'
		enableGameTests = true
		enableClientGameTests = true
	}
}

// The headless GameTest server writes a machine-readable JUnit XML report (vanilla
// JUnitLikeTestReporter) via the fabric-api.gametest.report-file system property, so CI and the
// gate get per-test pass/fail evidence. Resolved at configuration time via layout.buildDirectory
// (the Gradle 9 replacement for the removed buildDir property).
loom.runs.named('gameTest') {
	property 'fabric-api.gametest.report-file', layout.buildDirectory.file('test-results/gametest/junit.xml').get().asFile.absolutePath
}

// Stage B (issue #42): the client GameTest lane. Only jujutsumod-gametest's client tests may
// run — the modid filter keeps foreign dev-classpath mods out and makes ordering deterministic.
// There is no client analog of fabric-api.gametest.report-file in fabric-api 0.136.1 (source-
// verified): the lane's machine-readable result is the task exit code; evidence = logs,
// crash-reports and screenshots under build/run/clientGameTest/.
loom.runs.named('clientGameTest') {
	property 'fabric.client.gametest.modid', 'jujutsumod-gametest'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Ported Rich-Modern clickgui sources use lombok (main + client source sets).
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	clientCompileOnly 'org.projectlombok:lombok:1.18.36'
	clientAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	// Minecraft is transformed at runtime, so a bare JUnit run cannot touch it. fabric-loader-junit
	// boots the loader for the test JVM, which is what makes registry- and buffer-level tests possible
	// at all. The JavaExec verification programs keep running unchanged beside this.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Structural rules read compiled bytecode, so they survive renames and formatting in a way the
	// source-text checks they replace never could. The plain artifact rather than archunit-junit5:
	// @AnalyzeClasses imports by package off the classpath, which would fuse the split main and client
	// outputs into one graph and quietly make the side-separation rule check nothing.
	testImplementation 'com.tngtech.archunit:archunit:1.4.1'
}

// ============================================================================
// Dev-only MCP companion (issue #43 spike): a second mod, jujutsumod-mcpdev,
// compiled from src/mcpdev against BOTH our main output and the upstream MCP
// server jar. Fully dormant without -PmcpUpstreamJar=<path> (every mcpdev task
// skips), so normal builds never need the upstream jar. The coupling direction
// is mcpdev -> {main, upstream}; production classes gain zero MCP imports.
// ============================================================================
def mcpUpstreamJar = providers.gradleProperty('mcpUpstreamJar').orNull
def mcpCompanionEnabled = mcpUpstreamJar != null && !mcpUpstreamJar.isBlank()

sourceSets {
	// Default conventions already map this set to src/mcpdev/{java,resources};
	// adding srcDir would register the same directory twice and duplicate every
	// resource entry (processMcpdevResources fails on the doubled fabric.mod.json).
	mcpdev {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

// The Java plugin only creates jar tasks for the main source set; the companion's
// jar is explicit and must exist before the -PmcpSpike wiring below references it.
// Skipped like every other mcpdev task without -PmcpUpstreamJar. Gradle 9 no longer
// attaches archive tasks to assemble implicitly, hence the explicit wiring: with
// -PmcpUpstreamJar, `assemble` also builds the companion jar.
tasks.register('jarMcpdev', Jar) {
	group = 'build'
	description = 'Assembles the dev-only jujutsumod-mcpdev companion jar'
	dependsOn tasks.named('mcpdevClasses')
	from sourceSets.mcpdev.output
	archiveFileName = "jujutsumod-mcpdev-${project.version}.jar"
}

tasks.named('assemble') {
	dependsOn tasks.named('jarMcpdev')
}

if (mcpCompanionEnabled) {
	dependencies {
		mcpdevCompileOnly files(mcpUpstreamJar)
	}
}

// No property -> the whole source set is dormant: assemble stays green with the
// mcpdev tasks skipped instead of failing on a missing upstream jar.
tasks.matching { it.name.toLowerCase().contains('mcpdev') }.configureEach {
	onlyIf { mcpCompanionEnabled }
}

tasks.named('processMcpdevResources') {
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

// Dev-only run knob: ./gradlew runClient -PmcpSpike -PmcpUpstreamJar=... loads the
// upstream MCP server mod and this companion mod into the dev classpath. Without
// -PmcpSpike runClient is byte-for-byte the pre-spike configuration.
//
// The upstream jar goes through modLocalRuntime so Loom remaps it to dev named
// mappings; the companion jar is already dev-mapped and must NOT be remapped, so
// it rides plain localRuntime (same runtime classpath, no Loom checksum/remap
// pass — Loom checksums mod-configuration files eagerly at configuration time,
// before jarMcpdev has produced the jar).
if (project.hasProperty('mcpSpike') && mcpCompanionEnabled) {
	dependencies {
		modLocalRuntime files(mcpUpstreamJar)
		localRuntime files(tasks.named('jarMcpdev'))
	}

	// C4 (issue #43): autonomous world entry. --quickPlaySingleplayer boots straight into
	// the save whose folder name is the argument (run/saves/mcp-spike), so the dev-control
	// surface is reachable with no menu interaction. Seeded + options pre-seeded by
	// prepareMcpSpikeRun below.
	loom.runs.named('client') {
		programArgs '--quickPlaySingleplayer', 'mcp-spike'
	}

	// Seeds the quickPlay world and pre-seeds options.txt for autonomous runs. Idempotent:
	// the world is copied only when the target is absent, and options.txt is rewritten only
	// when one of the two keys is missing or wrong. Never launches the client.
	tasks.register('prepareMcpSpikeRun') {
		group = 'fabric'
		description = 'Seeds the mcp-spike quickPlay world from run/saves/New World and pre-seeds run/options.txt for autonomous client runs'
		// Capture the project at configuration time: Task.project at execution time is
		// deprecated (fails in Gradle 10, and this build must stay configuration-cache-safe).
		Project projectRef = project
		File runDir = project.file('run')
		File optionsFile = new File(runDir, 'options.txt')
		File sourceWorld = new File(runDir, 'saves/New World')
		File targetWorld = new File(runDir, 'saves/mcp-spike')
		doLast {
			// options.txt: keep every existing key, force the two autonomous-run keys.
			Map<String, String> options = [:]
			if (optionsFile.exists()) {
				optionsFile.eachLine('UTF-8') { String line ->
					int colon = line.indexOf(':')
					if (colon > 0) {
						options[line.substring(0, colon)] = line.substring(colon + 1)
					}
				}
			}
			if (optionsFile.exists()
					&& options.get('pauseOnLostFocus') == 'false'
					&& options.get('tutorialStep') == 'none') {
				logger.lifecycle('prepareMcpSpikeRun: run/options.txt already seeded (pauseOnLostFocus:false, tutorialStep:none)')
			} else {
				options['pauseOnLostFocus'] = 'false'
				options['tutorialStep'] = 'none'
				optionsFile.parentFile.mkdirs()
				optionsFile.withWriter('UTF-8') { writer ->
					options.sort().each { key, value -> writer.writeLine("${key}:${value}") }
				}
				logger.lifecycle('prepareMcpSpikeRun: wrote run/options.txt with pauseOnLostFocus:false and tutorialStep:none (all other keys preserved)')
			}

			// World seed: copy New World -> mcp-spike once; never overwrite an existing seed.
			if (targetWorld.exists()) {
				logger.lifecycle('prepareMcpSpikeRun: world run/saves/mcp-spike already present — skipping copy')
			} else if (sourceWorld.exists()) {
				projectRef.copy {
					from sourceWorld
					into targetWorld
				}
				logger.lifecycle('prepareMcpSpikeRun: copied run/saves/New World -> run/saves/mcp-spike')
			} else {
				logger.warn('prepareMcpSpikeRun: neither run/saves/mcp-spike nor run/saves/New World exists — skipping world copy; quickPlay will fail until a world exists (launch the game once and create a save, or drop one into run/saves/), then re-run this task or runClient')
			}
		}
	}

	// Automatic wiring: every -PmcpSpike runClient launch seeds itself first.
	tasks.named('runClient') {
		dependsOn 'prepareMcpSpikeRun'
	}
}

