name: Публикация сайта

on:
  push:
    branches:
      - main
      - site/ai-slop-landing
    paths:
      - "jujutsu-site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: "jujutsu-site"

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
